<div class="layout">
  <section tes-card class="chat" aria-labelledby="chat-title">
    <h2 id="chat-title">{{ i18n.t().chat.title }}</h2>
    <app-chat-panel />
  </section>
  <section class="map" role="region" [attr.aria-label]="i18n.t().map.label">
    <app-map-view
      [places]="session.places()"
      [boroughs]="boroughs.hasValue() ? boroughs.value() : []"
      [selected]="session.selected()"
      (selectedChange)="session.selected.set($event)"
    />
  </section>
</div>
