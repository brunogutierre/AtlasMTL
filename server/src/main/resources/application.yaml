spring:
  application:
    name: atlasmtl
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DATABASE_USER:atlas}
    password: ${DATABASE_PASSWORD:atlas}
    hikari:
      data-source-properties:
        # No query may run longer than 5 s, whatever the tool arguments.
        options: "-c statement_timeout=5000"
  mvc:
    async:
      # An answer with several tool calls can take a while; the agent stops at 6 calls.
      request-timeout: 2m
  ai:
    model:
      chat: anthropic
    anthropic:
      # A placeholder lets the app start without a key; answers then fail with an error event.
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ATLAS_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health
