spring:
  application:
    name: atlasmtl
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DATABASE_USER:atlas}
    password: ${DATABASE_PASSWORD:atlas}
    hikari:
      data-source-properties:
        # No query may run longer than 5 s, whatever the tool arguments. Through a transaction
        # pooler (Neon's PgBouncer), set DATABASE_OPTIONS empty and the timeout on the role instead.
        options: ${DATABASE_OPTIONS:-c statement_timeout=5000}
  flyway:
    # Migrations take a session-level lock, which transaction poolers don't support: they can use
    # a direct connection while the app uses the pooled one.
    url: ${DATABASE_MIGRATION_URL:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  mvc:
    async:
      # An answer with several tool calls can take a while; the agent stops at 6 calls.
      request-timeout: 2m
  ai:
    model:
      chat: anthropic
    anthropic:
      # A placeholder lets the app start without a key; answers then fail with an error event.
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ATLAS_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          temperature: 0.2

server:
  # Hosts such as Render pass the port to listen on in PORT.
  port: ${PORT:8080}
  # Behind a proxy, take the client address from X-Forwarded-For, trusting only proxies on private
  # networks (Tomcat's default internal proxies). The rate limits and budgets depend on it.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

atlas:
  usage:
    # US dollars per million tokens of the default model, Claude Haiku 5.5, for prompts up to
    # 100,000 tokens (platform.claude.com/docs/en/about-claude/pricing, checked 2026-11-24).
    input-usd-per-million: ${ATLAS_INPUT_USD_PER_MILLION:0.10}
    output-usd-per-million: ${ATLAS_OUTPUT_USD_PER_MILLION:0.50}
    # Keys the visitor hashes; set it in production so ids survive restarts.
    visitor-key: ${ATLAS_VISITOR_KEY:}
  limits:
    questions-per-minute: ${ATLAS_QUESTIONS_PER_MINUTE:5}
    visitor-daily-tokens: ${ATLAS_VISITOR_DAILY_TOKENS:60000}
    # Estimated USD per day for everyone; past it, only cached answers are served.
    global-daily-usd: ${ATLAS_GLOBAL_DAILY_USD:2.00}
