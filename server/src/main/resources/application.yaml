spring:
  application:
    name: atlasmtl
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DATABASE_USER:atlas}
    password: ${DATABASE_PASSWORD:atlas}
    hikari:
      data-source-properties:
        # No query may run longer than 5 s, whatever the tool arguments.
        options: "-c statement_timeout=5000"
  mvc:
    async:
      # An answer with several tool calls can take a while; the agent stops at 6 calls.
      request-timeout: 2m
  ai:
    model:
      chat: anthropic
    anthropic:
      # A placeholder lets the app start without a key; answers then fail with an error event.
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ATLAS_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health

atlas:
  usage:
    # US dollars per million tokens of the default model; check the provider's price list.
    input-usd-per-million: ${ATLAS_INPUT_USD_PER_MILLION:1}
    output-usd-per-million: ${ATLAS_OUTPUT_USD_PER_MILLION:5}
    # Keys the visitor hashes; set it in production so ids survive restarts.
    visitor-key: ${ATLAS_VISITOR_KEY:}
  limits:
    questions-per-minute: ${ATLAS_QUESTIONS_PER_MINUTE:5}
    visitor-daily-tokens: ${ATLAS_VISITOR_DAILY_TOKENS:60000}
    # Estimated USD per day for everyone; past it, only cached answers are served.
    global-daily-usd: ${ATLAS_GLOBAL_DAILY_USD:2.00}
