# Render Blueprint for the public demo (https://render.com/docs/blueprint-spec). Secrets are
# never written here: `sync: false` makes Render ask for each value when the Blueprint is applied.
services:
  - type: web
    name: atlasmtl
    runtime: docker
    region: virginia # next to Neon's aws-us-east-1
    # Free: 512 MB, sleeps after 15 minutes without traffic and takes about a minute to wake up.
    # Switch to starter (paid, never sleeps) in the dashboard or here, with no code change.
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # pooled: jdbc:postgresql://<endpoint>-pooler.<region>.aws.neon.tech/<db>?sslmode=require
        sync: false
      - key: DATABASE_MIGRATION_URL # direct: the same without "-pooler"
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_OPTIONS # empty through the pooler; the timeout is set on the role
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATLAS_VISITOR_KEY
        generateValue: true
      # Render sits behind Cloudflare, which overwrites this header with the visitor's address.
      # X-Forwarded-For alone ends at a shared Cloudflare edge address (see Visitors.java).
      - key: ATLAS_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Small footprint for the free instance's 0.1 CPU: serial GC, smaller thread stacks and code
      # cache, and C1 only, which starts faster. The heap size stays in the Dockerfile.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1
      - key: ATLAS_GLOBAL_DAILY_USD
        value: "2.00"
